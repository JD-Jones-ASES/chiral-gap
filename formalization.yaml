version: v0.4
project:
  name: Exact robust gaps in finite open chiral chains
  description: >-
    Exact worst squared spectral gaps for finite open chiral chains with
    inhomogeneous strong-bond lower bounds and weak-bond ratio intervals.
    The scalar optimum is the minimum over the ordered one-switch endpoint
    configurations, with a two-certificate reduction when cuts are allowed.
    Strictly positive weak lower bounds give a complete point-or-edge
    classification of scalar minimizers and an exact aligned-channel
    equality criterion for arbitrary complex matrix disorder. The sharp
    channel bound includes the finite chiral Hamiltonian spectral bridge.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.SP, math-ph]
  msc2020: [15A18, 15A42, 47A75, 81Q10]
sources:
  - title: Exact robust gaps for finite open chiral chains
    type: other
    authors: [JD Jones]
    relationship: formalizes
    notes: >-
      Proof.md in this repository gives the complete mathematical account
      formalized here. Note.md records the literature comparison and its
      scope. Disclosure.md records AI assistance and contributions.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI GPT 6 Pro; OpenAI Codex with GPT-6 Astra and collaborating agents
      notes: >-
        Agents reconstructed and extended the mathematical arguments and
        developed the Lean proof, documentation and verification workflow.
        Tactics produce proof terms for kernel checking. No computational
        oracle, custom axiom or unsafe evaluator is a proof input.
review:
  status: agent-reviewed
  notes: >-
    Internal agent review checks theorem scope, scalar-to-channel transfer,
    the actual directional ratios and the distinction between squared gap
    and excitation gap. No independent human specialist review or worldwide
    priority determination is claimed. Disclosure.md records AI assistance.
fidelity:
  notes: >-
    Finite open chains only. Positive weak lower bounds are required for the
    complete point-or-edge minimizer and equality-channel classification;
    the value theorem permits zero lower bounds and fixed intervals.
    The cut-allowed boundary-threshold classification, ordered boundary
    transitions and determinant stability estimate are proved in Proof.md
    and are supplementary informal results outside the compared declarations.
